name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

# A new push to a PR cancels that PR's older run. Pushes to main get a group per commit, so they never cancel (or,
# as a pending run in a shared group would be, get superseded by) each other: release.yml's verify-ci job waits for
# the CI run on the exact commit it's releasing, and a cancelled run there would block the release.
concurrency:
  group: ${{ github.workflow }}-${{ github.event_name == 'pull_request' && github.ref || github.sha }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  test:
    name: Test (Node ${{ matrix.node }}, ${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    # A green run takes a minute or two; a hung test should fail fast, not hold a runner for six hours.
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        node: [22, 24]
        # macOS is the primary platform and Linux is supported alongside it (D26), so both run everything.
        os: [ubuntu-latest, macos-latest]
        # The oldest supported Node (engines.node): the first 22.x where node:sqlite needs no flag (D37). The `22`
        # above resolves to the newest 22.x, so without this the floor would go untested.
        include:
          - node: '22.13'
            os: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      # Node 22 bundles npm 10 and the lockfile was written by npm 11; `npm ci` reads it fine with both.
      - uses: actions/setup-node@v7
        with:
          node-version: ${{ matrix.node }}
          cache: npm
      # Before `npm ci`: it needs no dependencies and is near-instant. A raw 0x00 in a source file is invisible in
      # diffs and makes grep/ripgrep skip the whole file as binary, so nothing else would notice it
      # (scripts/check-no-nul-bytes.mjs).
      - name: No raw NUL bytes in JS/TS sources
        run: npm run check:nul
      - run: npm ci
      - name: Typecheck
        run: npm run typecheck
      - name: Tests
        run: npm test
      - name: Build
        run: npm run build
      # Packs the package, installs the tarball into a temp prefix and runs it as a user would (scripts/smoke-pack.mjs).
      - name: Smoke-test the npm package
        run: npm run smoke:pack

  # ---------------------------------------------------------------------------------------------------------------
  # Managed services against the REAL service manager: launchd's gui/<uid> domain on the macOS runner, systemd's
  # user instance on the Ubuntu runner (lingering turned on so there is one). scripts/services-real.mjs installs the
  # daemon and two apps, drives their lifecycle (including KeepAlive after a crash) and removes them. It writes into
  # the runner's real LaunchAgents / systemd user directories, which is why it runs only here.
  # ---------------------------------------------------------------------------------------------------------------
  services:
    name: Services (real ${{ matrix.os == 'macos-latest' && 'launchd' || 'systemd' }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run build
      - name: Start a systemd user instance (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo loginctl enable-linger "$USER"
          for i in $(seq 1 20); do [ -S "/run/user/$(id -u)/bus" ] && break; sleep 0.5; done
          echo "XDG_RUNTIME_DIR=/run/user/$(id -u)" >> "$GITHUB_ENV"
          echo "DBUS_SESSION_BUS_ADDRESS=unix:path=/run/user/$(id -u)/bus" >> "$GITHUB_ENV"
      - name: The service lifecycle, for real
        env:
          HALLWAY_REAL_SERVICES: '1'
        run: node scripts/services-real.mjs

  # ---------------------------------------------------------------------------------------------------------------
  # Fronted mode for real (D47): `hallway setup` with the runner's passwordless sudo installs the 443/80 redirect (pf
  # on macOS, nftables on Linux), trusts Hallway's CA system-wide and runs Caddy (and, for a custom domain, dnsmasq)
  # as user-level jobs; scripts/fronted-real.mjs then checks v1's acceptance criteria with curl and the system trust
  # store, and that `hallway teardown` leaves nothing behind. It changes the runner's firewall, trust store and
  # resolver, which is why it runs only here. On macOS, setup installs Caddy and dnsmasq itself, with Homebrew.
  # ---------------------------------------------------------------------------------------------------------------
  fronted:
    name: Fronted mode (real ${{ matrix.os == 'macos-latest' && 'pf, keychain' || 'nftables, resolved' }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run build
      - name: Start a systemd user instance (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo loginctl enable-linger "$USER"
          for i in $(seq 1 20); do [ -S "/run/user/$(id -u)/bus" ] && break; sleep 0.5; done
          echo "XDG_RUNTIME_DIR=/run/user/$(id -u)" >> "$GITHUB_ENV"
          echo "DBUS_SESSION_BUS_ADDRESS=unix:path=/run/user/$(id -u)/bus" >> "$GITHUB_ENV"
      # Distribution packages of Caddy are older than the 2.7 Hallway needs (and start a system Caddy on :80), so a
      # release binary, as Hallway's own docs tell Linux users to do.
      - name: Caddy, nftables and dnsmasq (Linux)
        timeout-minutes: 5
        if: runner.os == 'Linux'
        env:
          CADDY_VERSION: 2.11.7
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq nftables dnsmasq-base
          curl -fsSL "https://github.com/caddyserver/caddy/releases/download/v${CADDY_VERSION}/caddy_${CADDY_VERSION}_linux_amd64.tar.gz" | tar xz caddy
          sudo install -m 0755 caddy /usr/local/bin/caddy
          caddy version
      - name: The generated config, checked by the real Caddy (Linux)
        timeout-minutes: 5
        if: runner.os == 'Linux'
        run: node --import tsx --test test/proxy.test.ts
      # Every call in the script has its own timeout and every command setup runs has one too (a hung authorisation
      # prompt fails loudly), so this is only the backstop.
      - name: Setup, the criteria, teardown, for real
        timeout-minutes: 12
        env:
          HALLWAY_REAL_FRONTED: '1'
        run: |
          set -x
          node scripts/fronted-real.mjs
      - name: Logs
        if: always()
        timeout-minutes: 3
        run: |
          for f in "$(ls -d ${TMPDIR:-/tmp}/hw-fr-* 2>/dev/null | head -1)"/data/logs/*.log; do [ -f "$f" ] && { echo "== $f"; tail -50 "$f"; }; done; true

  # ---------------------------------------------------------------------------------------------------------------
  # Docs site (website/). The site is its own npm project, with its own package.json and lockfile; the root
  # typecheck, tests and package never include it. Until website/ exists, the filter never matches and this job
  # passes with its build steps skipped. When the site lands, adjust the steps below to its scripts (e.g. a link
  # checker), keeping the job name: `ci-passed` depends on it.
  # ---------------------------------------------------------------------------------------------------------------
  website:
    name: Docs site build
    runs-on: ubuntu-latest
    # paths-filter reads the PR's changed-file list through the API.
    permissions:
      contents: read
      pull-requests: read
    steps:
      - uses: actions/checkout@v7
      - uses: dorny/paths-filter@v4
        id: filter
        with:
          filters: |
            docs:
              - 'website/**'
      - uses: actions/setup-node@v7
        if: steps.filter.outputs.docs == 'true'
        with:
          node-version: 22
      - name: Install docs-site deps
        if: steps.filter.outputs.docs == 'true'
        run: npm install
        working-directory: website
      - name: Build docs site
        if: steps.filter.outputs.docs == 'true'
        run: npm run build
        working-directory: website
      # Every site-relative link (and #fragment) in the built pages resolves (no dependencies; scripts/check-links.mjs).
      - name: Check internal links
        if: steps.filter.outputs.docs == 'true'
        run: node scripts/check-links.mjs
        working-directory: website

  # One stable check name to require in branch rules, so the matrix can change without editing them.
  ci-passed:
    name: CI passed
    if: always()
    needs: [test, services, fronted, website]
    runs-on: ubuntu-latest
    steps:
      - name: Require every job to have passed
        env:
          RESULTS: ${{ join(needs.*.result, ' ') }}
        run: |
          echo "results: ${RESULTS}"
          for r in ${RESULTS}; do
            if [ "${r}" != "success" ]; then
              echo "::error::a required job concluded '${r}'"
              exit 1
            fi
          done

<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" width="1200" height="630">
  <!-- The 1200x630 social card. Rendered to public/og-image.png by `npm run brand` (scripts/make-brand.mjs).
       The text is set in whatever serif/sans/mono the rendering machine has, so check the PNG after re-rendering. -->
  <defs>
    <radialGradient id="lamp" cx="0.72" cy="0.18" r="0.7">
      <stop offset="0" stop-color="#f0b45a" stop-opacity="0.22"/>
      <stop offset="1" stop-color="#f0b45a" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="lit" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#f7c87e"/>
      <stop offset="1" stop-color="#f0b45a"/>
    </linearGradient>
    <linearGradient id="spill" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#f0b45a" stop-opacity="0.45"/>
      <stop offset="1" stop-color="#f0b45a" stop-opacity="0"/>
    </linearGradient>
  </defs>
  <rect width="1200" height="630" fill="#14110d"/>
  <rect width="1200" height="630" fill="url(#lamp)"/>
  <!-- floor and skirting -->
  <rect x="0" y="520" width="1200" height="110" fill="#1b1611"/>
  <rect x="0" y="512" width="1200" height="8" fill="#2b2017"/>

  <!-- doors: each painted differently, each with a number plate -->
  <g font-family="'JetBrains Mono', 'DejaVu Sans Mono', monospace" font-size="15" text-anchor="middle">
    <!-- 5622: ajar -->
    <g transform="translate(660 300)">
      <path d="M0 212V60a50 50 0 0 1 100 0v152z" fill="url(#lit)"/>
      <path d="M0 212V60a50 50 0 0 1 80-40L78 212z" fill="#5a4330"/>
      <circle cx="64" cy="132" r="4" fill="#d9a55b"/>
      <path d="M78 212h22l40 30H82z" fill="url(#spill)"/>
      <path d="M0 212V60a50 50 0 0 1 100 0v152" fill="none" stroke="#e9dcc6" stroke-width="4"/>
      <rect x="22" y="-26" width="56" height="22" rx="3" fill="#d9a55b"/>
      <text x="50" y="-10" fill="#24180a">5622</text>
    </g>
    <!-- 4321: closed -->
    <g transform="translate(790 300)">
      <path d="M0 212V60a50 50 0 0 1 100 0v152z" fill="#3e4a52"/>
      <circle cx="80" cy="132" r="4" fill="#d9a55b"/>
      <path d="M0 212V60a50 50 0 0 1 100 0v152" fill="none" stroke="#6b5a45" stroke-width="4"/>
      <rect x="22" y="-26" width="56" height="22" rx="3" fill="#d9a55b"/>
      <text x="50" y="-10" fill="#24180a">4321</text>
    </g>
    <!-- 4255: ajar -->
    <g transform="translate(920 300)">
      <path d="M0 212V60a50 50 0 0 1 100 0v152z" fill="url(#lit)"/>
      <path d="M0 212V60a50 50 0 0 1 80-40L78 212z" fill="#6b3f3a"/>
      <circle cx="64" cy="132" r="4" fill="#d9a55b"/>
      <path d="M78 212h22l40 30H82z" fill="url(#spill)"/>
      <path d="M0 212V60a50 50 0 0 1 100 0v152" fill="none" stroke="#e9dcc6" stroke-width="4"/>
      <rect x="22" y="-26" width="56" height="22" rx="3" fill="#d9a55b"/>
      <text x="50" y="-10" fill="#24180a">4255</text>
    </g>
    <!-- 7333: closed -->
    <g transform="translate(1050 300)">
      <path d="M0 212V60a50 50 0 0 1 100 0v152z" fill="#4b5a3f"/>
      <circle cx="80" cy="132" r="4" fill="#d9a55b"/>
      <path d="M0 212V60a50 50 0 0 1 100 0v152" fill="none" stroke="#6b5a45" stroke-width="4"/>
      <rect x="22" y="-26" width="56" height="22" rx="3" fill="#d9a55b"/>
      <text x="50" y="-10" fill="#24180a">7333</text>
    </g>
  </g>

  <!-- the words -->
  <g transform="translate(80 150)">
    <path transform="scale(1.4)" d="M19 53V27a13 13 0 0 1 26 0v26z" fill="url(#lit)"/>
    <path transform="scale(1.4)" d="M19 53V27a13 13 0 0 1 20.4-10.7L39 53z" fill="#5a4330"/>
    <path transform="scale(1.4)" d="M19 53V27a13 13 0 0 1 26 0v26M14 53h36" fill="none" stroke="#e9dcc6" stroke-width="2.4"/>
  </g>
  <text x="80" y="320" font-family="'Fraunces', 'DejaVu Serif', serif" font-size="96" font-weight="600" fill="#f3ece2">Hallway</text>
  <text font-family="'Inter', 'DejaVu Sans', sans-serif" font-size="30" fill="#c9bca9">
    <tspan x="80" y="380">The front door for everything</tspan>
    <tspan x="80" y="420">you vibe-coded on a random port.</tspan>
  </text>
  <text x="80" y="575" font-family="'JetBrains Mono', 'DejaVu Sans Mono', monospace" font-size="22" fill="#f0b45a">hallway.edspencer.net</text>
</svg>
